services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perfume_web_app
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=PerfumeDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-PerfumePass@2026!};TrustServerCertificate=True;MultipleActiveResultSets=True;"
      ConnectionStrings__Redis: redis:6379
      Database__BackupPath: /var/opt/mssql/backup
      Storage__RootPath: /app/App_Data
      InitialAdmin__Email: ${INITIAL_ADMIN_EMAIL:-admin@perfumeluxe.vn}
      InitialAdmin__Password: ${INITIAL_ADMIN_PASSWORD:-AdminPassword123!}
      Jwt__Issuer: ${JWT_ISSUER:-PerfumeLuxe}
      Jwt__Audience: ${JWT_AUDIENCE:-PerfumeLuxe.Clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-SuperSecretPerfumeLuxeKeyWithAtLeast32BytesLength!}
      Smtp__Enabled: "true"
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__EnableSsl: "false"
      Smtp__FromEmail: noreply@perfumeluxe.local
      Smtp__FromName: PERFUME LUXE
    ports:
      - "${DOCKER_WEB_PORT:-5000}:8080"
    volumes:
      - app_data:/app/App_Data
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: perfume_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-PerfumePass@2026!}
      MSSQL_PID: Developer
    ports:
      - "${DOCKER_SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - sqlserver_backups:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-PerfumePass@2026!}\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-PerfumePass@2026!}\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: perfume_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: perfume_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  sqlserver_data:
  sqlserver_backups:
  redis_data:
  app_data:
