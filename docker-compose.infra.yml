services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: perfume_sqlserver_dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - sqlserver_backups:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: perfume_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:latest
    container_name: perfume_mailpit_dev
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
  adminer:
    image: adminer:latest
    container_name: perfume_adminer_dev
    ports:
      - "8088:8080"
    depends_on:
      - sqlserver
    restart: unless-stopped
volumes:
  sqlserver_data:
  sqlserver_backups:
  redis_data: