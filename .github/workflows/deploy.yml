name: Auto Deploy to Somee

on:
  push:
    branches: [ main, master, "codex/**" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish .NET Web App
      run: |
        dotnet publish src/Perfume.Web/Perfume.Web.csproj -c Release -o ./publish /p:UseAppHost=false
        cp -r scripts ./publish/scripts 2>/dev/null || true
        mkdir -p ./publish/logs

    - name: Put website offline (Unlock DLL files)
      run: |
        echo "<html><body><h2>Deploying updates... Please refresh in a moment.</h2></body></html>" > app_offline.htm
        curl --ftp-create-dirs -T app_offline.htm -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" ftp://perfumeluxe.somee.com/www.perfumeluxe.somee.com/app_offline.htm || true
        sleep 4

    - name: Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: perfumeluxe.somee.com
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /www.perfumeluxe.somee.com/
        local-dir: ./publish/
        dangerous-clean-slate: false

    - name: Bring website back online
      if: always()
      run: |
        curl -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" ftp://perfumeluxe.somee.com/ -Q "DELE /www.perfumeluxe.somee.com/app_offline.htm" || true
