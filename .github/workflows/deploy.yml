name: Auto Deploy to Somee

on:
  push:
    branches: [ main, master, "codex/**" ]
  workflow_dispatch:

# All these branches deploy to the same Somee site. Serialize them so a queued
# deployment from an older commit cannot overwrite a newer release.
concurrency:
  group: perfume-luxe-somee-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Skip stale deployment
      shell: bash
      run: |
        git fetch --quiet origin "$GITHUB_REF_NAME"
        branch_sha="$(git rev-parse FETCH_HEAD)"
        if [[ "$branch_sha" != "$GITHUB_SHA" ]]; then
          echo "::error::Skipping stale deployment $GITHUB_SHA; $GITHUB_REF_NAME is now at $branch_sha."
          exit 1
        fi

    - name: Calculate expected CSS version
      id: asset-version
      shell: bash
      run: |
        css_version="$(openssl dgst -sha256 -binary src/Perfume.Web/wwwroot/css/luxury-perfume.css | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
        icon_css_version="$(openssl dgst -sha256 -binary src/Perfume.Web/wwwroot/css/font-awesome-subset.css | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
        echo "css_version=$css_version" >> "$GITHUB_OUTPUT"
        echo "icon_css_version=$icon_css_version" >> "$GITHUB_OUTPUT"

    - name: Setup .NET SDK 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish .NET Web App
      run: |
        dotnet publish src/Perfume.Web/Perfume.Web.csproj -c Release -o ./publish /p:UseAppHost=false
        cp -r scripts ./publish/scripts 2>/dev/null || true
        mkdir -p ./publish/logs

    - name: Put website offline (Unlock DLL files)
      run: |
        echo "<html><body><h2>Deploying updates... Please refresh in a moment.</h2></body></html>" > app_offline.htm
        curl --ftp-create-dirs -T app_offline.htm -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" ftp://perfumeluxe.somee.com/www.perfumeluxe.somee.com/app_offline.htm || true
        sleep 4

    - name: Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: perfumeluxe.somee.com
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /www.perfumeluxe.somee.com/
        local-dir: ./publish/
        state-name: .ftp-deploy-sync-state-v2.json
        dangerous-clean-slate: false

    - name: Bring website back online
      if: always()
      run: |
        curl -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" ftp://perfumeluxe.somee.com/ -Q "DELE /www.perfumeluxe.somee.com/app_offline.htm" || true

    - name: Verify deployed storefront assets
      shell: bash
      env:
        EXPECTED_CSS_VERSION: ${{ steps.asset-version.outputs.css_version }}
        EXPECTED_ICON_CSS_VERSION: ${{ steps.asset-version.outputs.icon_css_version }}
      run: |
        for attempt in {1..12}; do
          status_code="$(curl -s -o /tmp/storefront.html -w "%{http_code}" --max-time 20 "https://perfumeluxe.somee.com/?deploy_check=$GITHUB_SHA" || true)"
          if [[ "$status_code" == "200" ]] && grep -Fq "PERFUME LUXE" /tmp/storefront.html; then
            echo "The live storefront is serving successfully with HTTP 200 OK from $GITHUB_SHA."
            exit 0
          fi
          echo "Waiting for Somee to start the deployed release ($attempt/12) - status: $status_code."
          sleep 5
        done
        echo "::error::The live storefront is not responding with HTTP 200 OK from $GITHUB_SHA."
        exit 1

    # Dem tong so lan chay, neu >= 15 ban thi tu dong kich hoat cleanup
    - name: Trigger cleanup if history reaches 15 runs
      if: always()
      shell: bash
      run: |
        total_runs=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" | jq '.total_count // 0')
        echo "Total workflow runs in repo: $total_runs"
        if [ "$total_runs" -ge 15 ]; then
          echo "Reached >= 15 runs threshold. Automatically triggering cleanup-actions-history workflow..."
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/cleanup-actions-history.yml/dispatches" \
            -d '{"ref":"main"}' || true
        else
          echo "Current runs ($total_runs) < 15, skipping cleanup trigger."
        fi
